<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        font-size: large;
      }
      .menu {
        display: flex;
        gap: 20px;
      }
      a {
        text-decoration: none;
        color: black;
      }
      @media (max-width: 768px) {
        nav {
          flex-direction: column;
        }
        .menu {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div>Logo</div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>
  </body>
</html>
